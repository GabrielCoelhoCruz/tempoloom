name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: build-parity.py compares each Google-proven test with
          # its source at the commit of the Google run (docs/e2e-google-run.tsv).
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Tests of the test() call reader in scripts/build-parity.py
        run: python3 -B -m unittest discover -s scripts -p "test_*.py"
      - name: Parity table matches scripts/build-parity.py
        run: python3 scripts/build-parity.py && git diff --exit-code docs/parity.md
      - run: npm test
      - run: npm run build
      - run: node bench/scheduler-week.ts 100

  caldav-e2e:
    # Integration and end-to-end tests against real servers in Docker on
    # loopback (Radicale for CalDAV, Mailpit for mail, Dex for single sign-on)
    # and real Chrome. The test fixtures start and stop the containers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install mkpasswd (bcrypt hashes for the Dex test user)
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends whois
      - name: Integration tests (Radicale)
        run: |
          scripts/caldav-server.sh start
          set -a; eval "$(scripts/caldav-server.sh env)"; set +a
          npm run test:integration
          scripts/caldav-server.sh stop
      - name: E2E tests (Radicale, Chrome)
        # The self-host job runs the @self-host test in parallel.
        run: npx playwright test --grep-invert @self-host
      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            .e2e/report
            .e2e/results.json
            .e2e/test-results
            .e2e/radicale.log
          retention-days: 14

  self-host:
    # Builds the Docker image and runs it with one SQLite volume against the
    # loopback Radicale: sign in, add a task, restart and replace the container,
    # check that the data is kept (tests/e2e/self-host.spec.ts). The image stays
    # on the runner; it is not pushed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: docker build -t tempoloom:ci .
      - name: Self-host E2E (Docker image, Radicale, Chrome)
        run: npx playwright test --grep @self-host
        env:
          TEMPOLOOM_SELFHOST_IMAGE: tempoloom:ci
      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-host-report
          path: |
            .e2e/report
            .e2e/results.json
            .e2e/test-results
          retention-days: 14
